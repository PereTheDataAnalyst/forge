[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natlas-forge-backend"
version = "0.1.0"
description = "Backend for N-ATLAS Forge, developer infrastructure for building with N-ATLAS."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic[email]>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "redis>=5.0.1,<7.0",
  "httpx>=0.27,<1.0",
  "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B008"]
