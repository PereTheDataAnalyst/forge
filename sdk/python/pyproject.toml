[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natlas-forge"
version = "0.1.0"
description = "Typed Python client for N-ATLAS Forge, a hosted API for the N-ATLAS language model."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
natlas_forge = ["py.typed"]
